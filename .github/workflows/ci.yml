name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (with dev extras)
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check app tests scripts
      - name: Typecheck (mypy strict)
        run: mypy app
      - name: Regenerate schema models (drift check)
        run: |
          python scripts/gen_models.py
          git diff --exit-code -- app/domain/schemas_generated \
            || (echo "::error::Generated models drifted from schemas/ — run backend/scripts/gen_models.py and commit" && exit 1)
      - name: Tests (pytest)
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Lint (eslint)
        run: npm run lint
      - name: Typecheck (tsc)
        run: npm run typecheck
      - name: Regenerate schema types (drift check)
        run: |
          npm run generate:types
          git diff --exit-code -- src/types/generated \
            || (echo "::error::Generated TS types drifted from schemas/ — run npm run generate:types and commit" && exit 1)
      - name: Unit tests (vitest)
        run: npm test
      - name: Build (production)
        run: npm run build

  content-validation:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate seeded content against canonical schemas
        working-directory: backend
        run: |
          pip install jsonschema pyyaml
          python - <<'PY'
          import json, sys
          from pathlib import Path
          from jsonschema import Draft202012Validator
          root = Path(".")
          schemas = root / ".." / "schemas"
          failures = []

          def validate(instance_path, schema_file):
              schema = json.loads((schemas / schema_file).read_text(encoding="utf-8"))
              validator = Draft202012Validator(schema)
              data = json.loads(Path(instance_path).read_text(encoding="utf-8"))
              return [f"{instance_path}: {e.message}" for e in validator.iter_errors(data)]

          for p in sorted((root / ".." / "content" / "components").glob("*.json")):
              failures += validate(p, "component.schema.json")

          if failures:
              print("\n".join(failures), file=sys.stderr)
              sys.exit(1)
          print("All seeded content valid against canonical schemas.")
          PY
