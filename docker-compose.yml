# Local orchestration for the system-design platform (PLAN.md section 18, Phase 0).
#   docker compose up --build          -> web :8080, api :8000, postgres :5432, redis :6379
#   docker compose --profile ollama up -> adds local LLM runtime on :11434
name: sdp

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sdp
      POSTGRES_PASSWORD: sdp_dev_only
      POSTGRES_DB: sdp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sdp -d sdp"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      SDP_ENVIRONMENT: local
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api

  # Optional free/local AI path (Phase 5). Not started by default.
  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  pgdata:
  ollama_data:
