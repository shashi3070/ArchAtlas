id: video-2-transcoding
title: "Video Platform II: Adaptive Streaming"
difficulty: intermediate
mode: challenge
narrative: "StreamVault needs adaptive bitrate streaming. Videos must be available in 360p, 720p, and 1080p within 1 hour of upload. Design the transcoding and delivery pipeline."
requirements:
- id: transcode-speed
  category: performance
  description: Videos transcoded to 3 resolutions within 1 hour
  priority: must
  metric: transcode_time
  value: 3600
  unit: seconds
- id: adaptive-streaming
  category: functional
  description: Player adapts quality based on bandwidth
  priority: must
  metric: resolutions
  value: 3
  unit: null
- id: concurrent-transcodes
  category: scale
  description: Handle 100 concurrent transcodes
  priority: should
  metric: concurrent
  value: 100
  unit: null
learning_objectives:
- Parallel transcoding workers
- HLS/DASH manifest generation
- CDN edge caching for video segments
allowed_components:
- client
- load_balancer
- api
- object_storage
- kafka
- worker
- cdn
- redis
constraints:
- key: max_nodes
  value: 12
hints:
  - 'Split video into segments; transcode segments in parallel across workers.'
  - 'HLS manifests reference segment URLs; generate after transcoding completes.'
  - 'Cache popular video segments at CDN edge; long-tail from origin.'
related_topics:
- video-streaming
- messaging-queues
chain:
  family_id: video-platform
  level: 2
version: 1.0.0
