id: repair-disconnected
title: 'Repair: Nobody Reaches the API'
difficulty: beginner
mode: repair
narrative: A contractor left the deployment half-wired. Components exist but requests go nowhere. Restore
  a working request path.
requirements:
- id: reachable-api
  category: functional
  description: Client traffic must reach the API tier at scale
  priority: must
  metric: rps
  value: 500
  unit: null
- id: stay-up
  category: availability
  description: No single instance can take the service down
  priority: should
  metric: availability
