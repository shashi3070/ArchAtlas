- term: "Availability"
  definition: "Fraction of time a system responds successfully, typically expressed in nines (99.9% = ~8.7h downtime/year)."
- term: "Backpressure"
  definition: "Signal propagating from overloaded consumers to producers to slow emission instead of buffering infinitely."
- term: "Bottleneck"
  definition: "The single stage constraining overall throughput; relieving others yields no end-to-end gain until it is fixed."
- term: "CAP theorem"
  definition: "Under network partition, a distributed store must trade off consistency versus availability."
- term: "CDC (Change Data Capture)"
  definition: "Streaming row-level changes from a database log to downstream consumers (e.g., Debezium)."
- term: "Circuit breaker"
  definition: "Wrapper that fails fast once a dependency's error rate crosses a threshold, probing periodically to recover."
- term: "Consistent hashing"
  definition: "Key-to-node mapping minimizing movement when the node set changes; basis of sharding and cache rings."
- term: "Denormalization"
  definition: "Deliberately duplicating data to avoid joins at read time, paid for with write amplification."
- term: "Durability"
  definition: "Guarantee that acknowledged writes survive crashes (WAL/fsync, replication factors)."
- term: "Eventual consistency"
  definition: "Replica convergence guarantee without read-freshness promises in the interim."
- term: "Fan-out"
  definition: "One request triggering multiple parallel downstream calls (or one event reaching many consumers)."
- term: "Heartbeat"
  definition: "Periodic liveness signal between nodes; absence triggers failure detection and failover."
- term: "Idempotency"
  definition: "Property that repeating an operation leaves state unchanged - the enabler of safe retries."
- term: "Latency budget"
  definition: "Total time allowance a user experience permits, allocated across hops."
- term: "Leader election"
  definition: "Process selecting one coordinator among replicas, typically via consensus (Raft/Paxos)."
- term: "Load shedding"
  definition: "Deliberately rejecting excess low-priority traffic under saturation instead of degrading everyone."
- term: "MVCC"
  definition: "Multiversion concurrency control - readers see snapshots while writers create new versions, reducing lock contention."
- term: "p50/p95/p99"
  definition: "Latency percentiles; tail values expose user pain averages hide."
- term: "Quorum"
  definition: "Majority subset (of replicas/votes) required to commit reads/writes, ensuring overlap: R+W>N."
- term: "Read replica"
  definition: "Copy of a database serving read traffic, lagging slightly behind the primary."
- term: "Scatter-gather"
  definition: "Query pattern fanning out to shards/services and merging responses; bounded by the slowest branch."
- term: "Sharding"
  definition: "Horizontal partitioning of data across nodes by key; multiplies capacity and operational surface."
- term: "Single point of failure (SPOF)"
  definition: "Component whose failure takes down the system; elimination drives redundancy everywhere."
- term: "SLO/Error budget"
  definition: "Target reliability level; remaining budget governs release pace and paging urgency."
- term: "Sticky session"
  definition: "Routing a user's requests consistently to one server, trading balance evenness for locality."
- term: "Thundering herd"
  definition: "Simultaneous identical work triggered by an event (expiry, restart); prevented via locks/coalescing/jitter."
- term: "TTL (Time To Live)"
  definition: "Bound on how long cached data (or DNS records) remain trusted before refresh."
- term: "Two-phase commit"
  definition: "Atomic commit protocol across participants; coordinator failure can block - avoided in favor of sagas."
